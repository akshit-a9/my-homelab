[global]
   workgroup = WORKGROUP
   server string = homelab
   server role = standalone server
   map to guest = never
   server min protocol = SMB3
   hosts allow = 127.0.0.1 100.64.0.0/255.192.0.0 192.168.0.0/255.255.0.0
   log file = /var/log/samba/log.%m
   max log size = 1000

[nas]
   path = /srv/media
   valid users = akshit
   read only = no
   ea support = no
   store dos attributes = no
   veto files = /immich/

[backup]
   path = /srv/backup
   valid users = akshit
   read only = yes
