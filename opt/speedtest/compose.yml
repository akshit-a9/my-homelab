services:
  speedtest:
    image: lscr.io/linuxserver/speedtest-tracker:latest
    container_name: speedtest
    ports:
      - "8765:80"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Kolkata
      - DISPLAY_TIMEZONE=Asia/Kolkata
      - APP_KEY=${APP_KEY}
      - APP_URL=http://homelab:8765
      - DB_CONNECTION=sqlite
      - SPEEDTEST_SCHEDULE=17 2,8,14 * * *
    volumes:
      - ./config:/config
    restart: unless-stopped
