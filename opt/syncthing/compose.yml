services:
  syncthing:
    image: syncthing/syncthing:latest
    container_name: syncthing
    hostname: homelab
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/var/syncthing
      - /srv/media:/media
    ports:
      - "8384:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    restart: unless-stopped
